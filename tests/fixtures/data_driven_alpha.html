<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two labels on a cell the data shaded — pl-review-sense, reduced</title>
<style>
:root { --bg: #ffffff; --text: #1c2430; --muted: #5b6472; --accent: #2563eb; }
.chart .cell { fill: var(--accent); }
.chart .cell-text { fill: var(--text); font-size: 12px; }
.chart .cell-share { fill: var(--muted); font-size: 10px; }
</style>
</head>
<body>
<div class="chart-wrap"><svg class="chart" viewBox="0 0 320 120" width="320" height="120" role="img" aria-label="Confusion matrix, reduced"><title>Confusion matrix, reduced</title>
<rect class="cell" x="96" y="46" width="100" height="54" rx="3" fill-opacity="0.524"></rect>
<text class="cell-text" x="146.0" y="73.0" text-anchor="middle">323</text>
<text class="cell-share" x="146.0" y="89.0" text-anchor="middle">95% of row</text>
<rect class="cell" x="200" y="46" width="100" height="54" rx="3" fill-opacity="0.000"></rect>
<text class="cell-text" x="250.0" y="73.0" text-anchor="middle">0</text>
<text class="cell-share" x="250.0" y="89.0" text-anchor="middle">0% of row</text>
</svg></div>
</body>
</html>
