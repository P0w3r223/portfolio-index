# The index half of ADR-0004's K-c: one checker, one CI, no vendored copies to drift.
#
# Three jobs since S11, and the core/surfaces split is the same one the test suite makes.
# *This comment said "Two jobs" from before `live` existed until 2026-09-10, in the first
# line of the file `CLAUDE.md`'s map points at, where it enumerates all three.*
#
# `core` proves the checker without a single submodule on disk — every fixture it reads
# is committed here — so it stays green whatever the twelve repositories do next, and it
# is the job that must never be
# allowed to go red. `surfaces` points the checker at the real working trees; its tests skip
# themselves when a submodule is absent, so a fetch that fails degrades to a green skip
# rather than to a false failure about a page nobody touched.
#
# Since 0008 S-gate the checker also decides: it exits non-zero when a clause in `GATED`
# fails, when a committed surface could not be read, or when a same-origin stylesheet the
# page names could not be opened. The gate was a deliberately partial ratchet until S9 and
# S10 closed clause 8 and clause 4-<title>; every clause key is now gated, and what stays
# outside is `served` and every `UNDECIDED` status, both for reasons __main__.py states.
# The guards are `tests/test_report.py` (the gate's own behaviour, no submodule needed) and
# `test_the_ratchet_holds_no_clause_the_committed_surfaces_report_failing` in
# `tests/test_published_surfaces.py`, which refuses a registry widened past its measurement
# and, since 0009 §7 row 13b, runs in `live` too over the twelve the gate actually covers.
#
# This paragraph said the opposite until S-gate, and named a test that no longer exists. It
# is called out rather than quietly rewritten because ADR-0004 §6 and 0008 §4.12 both make
# claims about this file, and for one commit those claims were true of the checker's
# docstring and false of the workflow beside it — which is the defect they describe.

name: pagespec

on:
  push:
    branches: [main]
    # `docs/**` and `CLAUDE.md` entered 2026-09-11 with `tools/citations.py`, and they
    # arm `surfaces` as well as `core` — `paths:` is per trigger, not per job, and only
    # `live` carries an `if:`. That is accepted rather than worked around. A job-level
    # `if:` has no changed-paths context without a marketplace action, which this
    # repository does not take, and any `if:` on `surfaces` whose condition omits
    # 'push' and 'pull_request' silently moves that job into the `guarded` set of
    # `test_the_wire_never_reaches_the_push_path`, exempting it from the --fetch
    # check — a predicate that docstring already records getting too narrow three
    # times. The cost bought is small: a docs-only commit moves no gitlink, so
    # `surfaces` reads the same pages it read last run. `ADR-0009` §4.
    # The submodule gitlinks are in this list because the table is a statement about the
    # pages, not about the checker: this repository re-points submodules constantly, and
    # a filter naming only `tools/**` would refresh the table when the instrument changes
    # and never when a page does.
    paths: ['tools/**', 'tests/**', 'docs/**', 'CLAUDE.md', 'pyproject.toml',
            '.github/workflows/pagespec.yml', '.gitignore',
            'ab-lab', 'apply-scout', 'auth-log-scan', 'car-price-ml', 'doc-extract',
            'it-job-radar', 'mini-traceroute', 'mlops-car-price', 'pl-jobs-lora',
            'pl-review-sense', 'wroclaw-air-insights']
  pull_request:
    paths: ['tools/**', 'tests/**', 'docs/**', 'CLAUDE.md', 'pyproject.toml',
            '.github/workflows/pagespec.yml', '.gitignore',
            'ab-lab', 'apply-scout', 'auth-log-scan', 'car-price-ml', 'doc-extract',
            'it-job-radar', 'mini-traceroute', 'mlops-car-price', 'pl-jobs-lora',
            'pl-review-sense', 'wroclaw-air-insights']
  schedule:
    # `wroclaw-air-insights` rebuilds daily and commits no HTML, so its row can go stale
    # with nothing in this repository changing at all. Daily rather than the Monday this
    # was, because the `live` job below is now the only thing that reads that page: at
    # weekly, a regression on the one surface that exists nowhere but the wire could stand
    # for six days. 0008 §4.11 policy 3 said "a daily job gates twelve" and the cron it
    # shipped against was the inherited weekly one.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Every `uses:` below is pinned to a commit SHA with its tag in a trailing comment, and the comment
# is the only thing that says which version it is. A tag is a moving pointer the action's owner can
# repoint; a SHA is the bytes that ran. Both actions here are GitHub's own, so this buys less than
# it would against a third-party action — it is done anyway because this workflow is about to be
# read publicly, and a public workflow is read as an example of how to write one. `0011` §5 is the
# finding. *"is about to be", not "is": `0011` §6 step 0 is still an open decision, and under its
# recommended route this repository stays private while a clean clone becomes the public one.*
#
# To bump: read the new SHA with `gh api repos/actions/<name>/git/ref/tags/<tag>` and change both
# the SHA and its comment together. A SHA whose comment has gone stale is worse than a bare tag,
# because it reads as verified and is not.

jobs:
  core:
    name: checker (no submodules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pytest
        # The checker itself is standard library only; pytest is the sole test dependency.
        run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: Run the suite without a single page on disk
        run: python -m pytest -q -m 'not submodules'
      - name: Every normative sentence, and what carries it
        # Printed, never gated — `tools/spec.py` exits 0 whatever it finds, because `0007`
        # §5's governing rule means no instrument can tell an uncarried sentence that is open
        # work from one that is a decision. Its guards ran in the step above and they gate on
        # the registry being malformed, which is a different question. Needs no submodule and
        # no network, so it belongs here rather than in `surfaces`.
        run: python -m tools.spec
      - name: Every citation of a numbered document, and the heading it resolves to
        # `ADR-0009` §3 step 1. Printed, never gated, on the same argument as the step
        # above: `unattributed` is a backlog no instrument can close, and `foreign` is a
        # legitimate citation of a sibling repository's decision document. The gating half is
        # `tests/test_citations.py`, which ran in the suite step and refuses an `unresolved`.
        run: python -m tools.citations

  surfaces:
    name: checker over the published surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: Sweep the working trees
        run: python -m pytest -q -m submodules
      - name: The conformance table, and the gate over the eleven committed surfaces
        # The output that replaces 0007 §3, and since 0008 S-gate it also decides. The gate
        # is a ratchet: `GATED` in __main__.py names the finding keys that report zero FAIL
        # everywhere, and a closing stage adds its own. S9 and S10 brought in the last two,
        # so this job now refuses on any clause failing on any of the eleven it can read.
        #
        # --fetch stays absent here and only here. The live URL belongs to the scheduled run
        # below: a network failure on a push would read as a page regression, which is the
        # reason this flag was excluded before there was a gate at all, and it survives the
        # gate unchanged.
        run: python -m tools.pagespec --detail

  live:
    # wroclaw-air-insights commits no HTML and rebuilds daily, so its row can go stale with
    # nothing in this repository changing — which is what the schedule above was added for.
    # It never served that purpose: no job passed --fetch, so no CI anywhere could read that
    # page. This job is the one that does, and it is separate from `surfaces` so a wire
    # failure reddens a scheduled run rather than a merge.
    name: the live surface
    # Since the `served` finding, this job is also the only place the checker answers the
    # clauses from the *served* bytes rather than from the committed file — `0009` §3.1's C1.
    # The eleven with a file additionally get `served`, comparing the two after folding line
    # endings; `wroclaw` has no file and emits none. A wire failure is `undecided` and a 404 is
    # `fail`, because "the page is gone" is an answer about the page and a DNS blip is not.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: All twelve, judged on the bytes the public actually receives
        run: python -m tools.pagespec --fetch --detail
      - name: The ratchet, over the same twelve the gate covers
        # Deliberately *after* the table and not before it, which is the opposite of the
        # `surfaces` job's order. This job is the only place the twelfth surface's findings
        # are ever printed, so a guard failing first would suppress the one output a reader
        # needs to act on it. `if: always()` for the same reason from the other side: the
        # table refusing must not skip the ratchet.
        #
        # `--fetch` is what makes the two ratchet halves read all twelve surfaces rather than
        # the eleven that commit a file — `0009` §7 row 13b. It is spelled the way the checker
        # spells it so that `test_the_wire_never_reaches_the_push_path`, which scans this file
        # for the literal string, keeps covering the new door for free.
        if: always()
        run: python -m pytest -q -m submodules --fetch
